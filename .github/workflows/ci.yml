name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runs unit, integration, regression and perf tests. The perf test fails
      # the job if p95 latency exceeds PERF_P95_MS (see docs/TEST_PROTOCOL.md).
      - name: Run test suite
        env:
          PERF_P95_MS: "50"
        run: pytest --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.xml
